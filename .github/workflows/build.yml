name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          LINUX_DEPS="$(uv run flet --version --json | jq -r '.linux_dependencies | join(" ")')"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Build
        run: uv run flet build ${{ matrix.target }} --build-number ${{ github.run_number }} --yes
      - uses: actions/upload-artifact@v4
        with:
          name: booruvision-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
